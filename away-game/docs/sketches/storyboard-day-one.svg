<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="'Comic Neue','Segoe Print','Bradley Hand',cursive,sans-serif">
  <rect width="1200" height="860" fill="#fbfbf8"/>
  <text x="40" y="44" font-size="26" fill="#1b2a41" font-weight="700">Storyboard: Amara's first day in Lisbon (Routine Rings v2)</text>
  <text x="40" y="70" font-size="15" fill="#5a6475">Slept 5h · crossed 5 time zones · plan says 6×200m, but coach set a rule before the trip</text>

  <g fill="none" stroke="#1b2a41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 92 L588 94 L586 460 L42 458 Z"/>
    <path d="M612 94 L1160 92 L1162 458 L610 460 Z"/>
    <path d="M42 486 L586 484 L588 832 L40 830 Z"/>
    <path d="M610 484 L1162 486 L1160 830 L612 832 Z"/>

    <!-- P1: bed, window, watch zoom -->
    <path d="M80 380 L380 380 M80 380 L80 340 M380 380 L380 350 M80 355 L380 355"/>
    <circle cx="112" cy="336" r="16"/>
    <path d="M128 340 L240 344 M240 344 L300 350"/>
    <rect x="420" y="130" width="120" height="90"/>
    <path d="M480 130 L480 220 M420 175 L540 175"/>
    <path d="M510 150 a14 14 0 1 0 12 22 a10 10 0 1 1 -12 -22"/>
    <circle cx="260" cy="210" r="70"/>
    <circle cx="260" cy="210" r="56" stroke="#1f6fb2" stroke-width="7" stroke-dasharray="120 400"/>
    <circle cx="260" cy="210" r="44" stroke="#2e8b57" stroke-width="7" stroke-dasharray="40 400"/>
    <circle cx="260" cy="210" r="32" stroke="#6b5ca5" stroke-width="7" stroke-dasharray="90 400"/>
    <path d="M190 300 L170 330" stroke-dasharray="6 6"/>

    <!-- P2: figure, thought, closed ring -->
    <circle cx="700" cy="282" r="18"/>
    <path d="M700 300 L700 350 M700 318 L740 300 M700 318 L670 338 M700 350 L682 386 M700 350 L718 386"/>
    <ellipse cx="820" cy="170" rx="150" ry="55"/>
    <circle cx="738" cy="240" r="8"/><circle cx="720" cy="258" r="5"/>
    <circle cx="1010" cy="300" r="80"/>
    <circle cx="1010" cy="300" r="64" stroke="#1f6fb2" stroke-width="8"/>
    <path d="M748 300 Q860 300 935 300" stroke-dasharray="6 6"/>

    <!-- P3: street, phone, pin -->
    <path d="M60 790 L560 700 M60 820 L560 760"/>
    <rect x="110" y="540" width="130" height="220" rx="16"/>
    <path d="M150 560 L200 560"/>
    <path d="M390 610 a26 26 0 1 1 52 0 c0 22 -26 50 -26 50 c0 0 -26 -28 -26 -50z" stroke="#1f6fb2"/>
    <circle cx="416" cy="610" r="8" stroke="#1f6fb2"/>
    <path d="M240 650 Q320 640 390 620" stroke-dasharray="6 6"/>

    <!-- P4: passport + coach at home -->
    <rect x="650" y="540" width="170" height="220" rx="6"/>
    <path d="M735 540 L735 760"/>
    <circle cx="690" cy="610" r="26" stroke="#6b5ca5"/>
    <circle cx="780" cy="640" r="26" stroke="#2e8b57" stroke-dasharray="5 5"/>
    <rect x="900" y="620" width="200" height="130" rx="8"/>
    <path d="M980 750 L960 790 M1020 750 L1040 790 M940 790 L1060 790"/>
    <circle cx="1000" cy="560" r="20"/>
    <path d="M1000 580 L1000 615"/>
    <path d="M880 520 Q860 560 830 580" stroke-dasharray="6 6"/>
  </g>

  <g fill="#1b2a41" font-size="16">
    <text x="58" y="120" font-weight="700">1 · 7:40am local, 2:40am body time</text>
    <text x="230" y="192" font-size="13" font-weight="700">Recover</text>
    <text x="222" y="208" font-size="11">coach's rule</text>
    <text x="58" y="420">Glances at her wrist before she's even up.</text>
    <text x="58" y="442" fill="#5a6475" font-size="14">Task model D1: "How wrecked am I?" gets a second opinion.</text>

    <text x="630" y="120" font-weight="700">2 · The guilt moment</text>
    <text x="700" y="162" font-size="15">"If I rest, am I</text>
    <text x="700" y="184" font-size="15">falling behind?"</text>
    <text x="966" y="296" font-size="13" font-weight="700">Recovery</text>
    <text x="956" y="314" font-size="13">closes ring ✓</text>
    <text x="630" y="420">Taps "Rested." The train ring still closes.</text>
    <text x="630" y="442" fill="#5a6475" font-size="14">Targets B3: rest counts as following the plan.</text>

    <text x="58" y="512" font-weight="700">3 · No signal</text>
    <text x="120" y="600" font-size="13">offline ✓</text>
    <text x="120" y="620" font-size="12">Park loop</text>
    <text x="120" y="638" font-size="12">17 min walk</text>
    <text x="120" y="656" font-size="12">verified ×6</text>
    <text x="300" y="560">Saved places still work</text>
    <text x="300" y="580">for a recovery walk.</text>
    <text x="300" y="700" fill="#5a6475" font-size="14">Targets B4, B5, B10</text>

    <text x="630" y="512" font-weight="700">4 · That night / back home</text>
    <text x="677" y="615" font-size="12">LIS</text>
    <text x="752" y="700" font-size="12">next city</text>
    <text x="912" y="660" font-size="13">Amara: rested</text>
    <text x="912" y="680" font-size="13">per rule ✓</text>
    <text x="912" y="700" font-size="13">Jonah: red !</text>
    <text x="630" y="808" fill="#5a6475" font-size="14">Stamp earned; summary sends when signal returns. Coach sees one line. B8.</text>
  </g>
</svg>
